<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="robots" content="noindex,nofollow,noarchive"><title>Customer Portal | OfficeOS</title><style>:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;--blue:#2563eb;--green:#15803d;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}.top{background:#111827;color:white;padding:calc(20px + env(safe-area-inset-top)) 18px 24px}.topin{max-width:760px;margin:auto}.brand{font-size:13px;font-weight:800;color:#93c5fd;letter-spacing:.08em;text-transform:uppercase}.business{font-size:28px;font-weight:850;letter-spacing:-.04em;margin-top:5px}.portal-label{color:#cbd5e1;margin-top:3px;font-size:14px}.wrap{max-width:760px;margin:auto;padding:18px 14px calc(34px + env(safe-area-inset-bottom))}.hello{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:5px 2px 16px}.hello h1{font-size:25px;margin:0;letter-spacing:-.035em}.badge{background:#dcfce7;color:#166534;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.card{background:white;border:1px solid var(--line);border-radius:21px;padding:16px;margin-bottom:14px;box-shadow:0 7px 24px rgba(15,23,42,.045)}.card h2{font-size:18px;margin:0 0 11px}.empty{padding:18px;text-align:center;color:var(--muted);background:var(--soft);border-radius:14px}.row{padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.title{font-weight:800;font-size:14px}.meta{color:var(--muted);font-size:12px;line-height:1.45;margin-top:3px}.status{flex:0 0 auto;border-radius:999px;background:#f1f5f9;padding:6px 8px;font-size:10px;font-weight:800;color:#475569}.status.Approved{background:#dcfce7;color:#166534}.status.Declined{background:#fee2e2;color:#991b1b}.money{font-size:18px;font-weight:850}.lines{margin-top:9px;background:var(--soft);border-radius:12px;padding:7px 10px}.line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:5px 0;font-size:12px;color:#475569}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:11px;padding:9px 12px;min-height:38px;background:#f1f5f9;color:var(--ink);font:inherit;font-size:12px;font-weight:800}.btn.primary{background:var(--blue);color:white}.btn.approve{background:#dcfce7;color:#166534}.btn.decline{background:#fee2e2;color:#991b1b}.contact{display:flex;gap:8px;flex-wrap:wrap}.footer{text-align:center;color:#94a3b8;font-size:11px;padding:8px}.loading{min-height:65vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.error{max-width:520px;background:white;border:1px solid #fecaca;border-radius:18px;padding:22px;color:#991b1b}.small{font-size:12px;color:var(--muted);margin-top:6px}.signature{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:10px}.signature input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;font:inherit;margin-top:6px;background:#fff}.decision-note{font-size:12px;margin-top:9px;padding:9px 10px;border-radius:10px;background:#f8fafc;color:#475569}.decision-note.approved{background:#f0fdf4;color:#166534}.decision-note.declined{background:#fef2f2;color:#991b1b}.busy{opacity:.55;pointer-events:none}@media(max-width:520px){.business{font-size:25px}.wrap{padding-left:11px;padding-right:11px}.card{border-radius:18px;padding:14px}.hello h1{font-size:22px}.between{gap:8px}}</style></head><body><header class="top"><div class="topin"><div class="brand">Powered by OfficeOS</div><div id="businessName" class="business">Customer Portal</div><div class="portal-label">Your project, schedule and billing in one place.</div></div></header><div id="app" class="loading">Loading your secure portal…</div><script>const SUPABASE_URL='https://bowrytgqbunodtmzvabp.supabase.co',SUPABASE_KEY='sb_publishable_RWtmsrw9v0dTZ2IaCF3Nbw_VVnnhLms';let portalData=null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});function dateText(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch{return d}}function timeText(v){if(!v)return'';try{const [h,m]=v.split(':');return new Date(2000,0,1,Number(h),Number(m||0)).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}catch{return v}}function decisionUI(x){if(x.type!=='Estimate')return'';if(x.status==='Approved')return`<div class="decision-note approved">✓ Approved${x.signedBy?` and signed by <b>${esc(x.signedBy)}</b>`:''}${x.approvalAt?` on ${new Date(x.approvalAt).toLocaleDateString()}`:''}.</div>`;if(x.status==='Declined')return`<div class="decision-note declined">This estimate was declined${x.approvalAt?` on ${new Date(x.approvalAt).toLocaleDateString()}`:''}.</div>`;return`<div class="signature" id="approval-${esc(x.id)}"><label class="meta">Electronic signature for approval</label><input id="signer-${esc(x.id)}" autocomplete="name" placeholder="Type your full name"><div class="actions"><button class="btn approve" onclick="estimateDecision('${esc(x.id)}','approved')">Approve & Sign</button><button class="btn decline" onclick="estimateDecision('${esc(x.id)}','declined')">Decline</button></div><div class="small">By selecting Approve & Sign, you confirm that the typed name is your electronic signature and that you approve this estimate.</div></div>`}function invoiceRows(list){if(!list.length)return'<div class="empty">No estimates or invoices to show.</div>';return list.map(x=>`<div class="row"><div class="between"><div><div class="title">${esc(x.type)} ${esc(x.number||'')}</div><div class="meta">${x.issueDate?`Issued ${dateText(x.issueDate)}`:''}${x.dueDate?` · Due ${dateText(x.dueDate)}`:''}</div></div><div style="text-align:right"><div class="money">${money(x.amount)}</div><span class="status ${esc(x.status||'')}">${esc(x.status||'')}</span></div></div>${x.lines?.length?`<div class="lines">${x.lines.map(l=>`<div class="line"><span>${esc(l.description||'Item')}${Number(l.qty||0)!==1?` × ${Number(l.qty||0)}`:''}</span><b>${money(Number(l.qty||0)*Number(l.rate||0))}</b></div>`).join('')}</div>`:''}${x.paymentUrl&&x.type==='Invoice'&&x.status!=='Paid'?`<div class="actions"><a class="btn primary" href="${esc(x.paymentUrl)}" target="_blank" rel="noopener">Pay Invoice</a></div>`:''}${decisionUI(x)}</div>`).join('')}function jobRows(list){if(!list.length)return'<div class="empty">No jobs to show yet.</div>';return list.map(x=>`<div class="row"><div class="between"><div><div class="title">${esc(x.title||'Job')}</div><div class="meta">${x.date?dateText(x.date):'Not scheduled'}${x.time?` · ${timeText(x.time)}`:''}${x.address?`<br>${esc(x.address)}`:''}</div></div><span class="status">${esc(x.status||'')}</span></div></div>`).join('')}function eventRows(list){const today=new Date().toISOString().slice(0,10),future=list.filter(x=>!x.date||x.date>=today);if(!future.length)return'<div class="empty">No upcoming appointments.</div>';return future.slice(0,10).map(x=>`<div class="row"><div class="between"><div><div class="title">${esc(x.title||x.type||'Appointment')}</div><div class="meta">${dateText(x.date)}${x.time?` · ${timeText(x.time)}`:''}${x.address?`<br>${esc(x.address)}`:''}</div></div><span class="status">${esc(x.type||'Scheduled')}</span></div></div>`).join('')}function render(d){portalData=d;document.getElementById('businessName').textContent=d.business?.name||'Customer Portal';const c=d.customer||{},contact=[];if(d.business?.phone)contact.push(`<a class="btn" href="tel:${esc(d.business.phone)}">Call</a>`);if(d.business?.email)contact.push(`<a class="btn" href="mailto:${esc(d.business.email)}">Email</a>`);if(d.business?.website)contact.push(`<a class="btn" href="${esc(d.business.website)}" target="_blank" rel="noopener">Website</a>`);document.getElementById('app').className='wrap';document.getElementById('app').innerHTML=`<div class="hello"><div><h1>Hi, ${esc((c.name||'there').split(' ')[0])}</h1><div class="small">Here’s the latest information shared with you.</div></div><span class="badge">Secure Link</span></div><section class="card"><h2>Upcoming</h2>${eventRows(d.events||[])}</section><section class="card"><h2>Your Jobs</h2>${jobRows(d.jobs||[])}</section><section class="card"><h2>Estimates & Invoices</h2>${invoiceRows(d.invoices||[])}</section>${contact.length?`<section class="card"><h2>Contact ${esc(d.business?.name||'the business')}</h2><div class="contact">${contact.join('')}</div></section>`:''}<div class="footer">This secure link expires ${new Date(d.expiresAt).toLocaleDateString()}.</div>`}async function estimateDecision(id,decision){const token=new URLSearchParams(location.search).get('token')||'',box=document.getElementById(`approval-${id}`),signer=document.getElementById(`signer-${id}`)?.value.trim()||'';if(decision==='approved'&&signer.length<2)return alert('Type your full name to approve and sign this estimate.');if(decision==='declined'&&!confirm('Decline this estimate?'))return;if(box)box.classList.add('busy');try{const r=await fetch(`${SUPABASE_URL}/functions/v1/officeos-customer-estimate-decision`,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({token,estimateRef:id,decision,signerName:signer})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not save your decision.');await load();}catch(e){alert(e.message||'Could not save your decision.');if(box)box.classList.remove('busy')}}async function load(){const token=new URLSearchParams(location.search).get('token')||'';if(!token)return fail('This customer portal link is missing or invalid.');try{const r=await fetch(`${SUPABASE_URL}/functions/v1/officeos-customer-portal-data`,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({token})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Portal could not be loaded.');render(d)}catch(e){fail(e.message||'This portal is unavailable.')}}function fail(msg){document.getElementById('app').className='loading';document.getElementById('app').innerHTML=`<div class="error"><b>Portal unavailable</b><div class="small">${esc(msg)}</div></div>`}load();</script></body></html>
