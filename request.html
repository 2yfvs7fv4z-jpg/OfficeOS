ment.getElementById('businessName').textContent=config.business?.name||'Project Request';document.getElementById('businessIntro').textContent=config.business?.intro||'Tell us about what you need.';document.getElementById('app').innerHTML=`<section class="card"><h1>Tell us about your project</h1><p>The more detail you provide, the easier it is for the business to review your request and prepare next steps.</p><div class="grid"><div><label>Your name *</label><input id="name" autocomplete="name"></div><div><label>Email</label><input id="email" type="email" autocomplete="email"></div></div><div class="grid"><div><label>Phone</label><input id="phone" type="tel" autocomplete="tel"></div><div><label>Project address</label><input id="address" autocomplete="street-address"></div></div><label>Service needed</label>${serviceField()}<label>What would you like done? *</label><textarea id="description" placeholder="Describe the project, problem, materials, style, rooms/areas involved, or anything else that would help."></textarea><label>Measurements or project details</label><textarea id="measurements" placeholder="Approximate dimensions, square footage, quantities, model numbers, or other useful details." style="min-height:88px"></textarea><div class="grid"><div><label>Preferred timing</label><input id="timing" placeholder="ASAP, next month, flexible..."></div><div><label>Budget range (optional)</label><input id="budget" placeholder="If you have one"></div></div><button id="submit" class="btn" onclick="send()">Send Request</button><div class="note">Submitting this form sends your information to the business for review. Any estimate or pricing is reviewed by the business before it is sent to you.</div></section><div class="footer">Secure request powered by OfficeOS.</div>`}async function send(){const btn=document.getElementById('submit'),payload={customerName:val('name'),email:val('email'),phone:val('phone'),address:val('address'),service:val('service'),description:val('description'),timing:val('timing'),measurements:val('measurements'),budget:val('budget')};if(!payload.customerName)return alert('Please enter your name.');if(!payload.email&&!payload.phone)return alert('Please enter an email or phone number.');if(!payload.service&&!payload.description)return alert('Please tell us what you need.');btn.disabled=true;btn.textContent='Sending…';try{const d=await api('submit',payload);document.getElementById('app').innerHTML=`<section class="card"><div class="success"><b>Request sent ✓</b><div style="margin-top:6px">${esc(d.message||'Thanks — the business will review your request and follow up.')}</div></div></section>`}catch(e){btn.disabled=false;btn.textContent='Send Request';alert(e.message||'Could not send your request.')}}async function load(){if(token.length<30)return fail('This request link is missing or invalid.');try{config=await api('load');render()}catch(e){fail(e.message||'This request form is unavailable.')}}function fail(msg){document.getElementById('app').innerHTML=`<div class="error"><b>Request form unavailable</b><div style="margin-top:6px">${esc(msg)}</div></div>`}load();</script></body></html>
